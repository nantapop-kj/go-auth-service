version: "3.8"
services:
  go-auth-db:
    image: postgres:15
    container_name: go-auth-db
    volumes:
      - ./db/data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    env_file: .env
    networks:
      - go-auth-network

  go-auth-service:
    image: go-auth-service:dev
    container_name: go-auth-service
    build:
      context: .
      dockerfile: dev.dockerfile
    command: [ "-c", "tail -f /dev/null" ]
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    env_file: .env
    volumes:
       - ./:/app
    depends_on:
      - go-auth-db
      - minio
      - redis
    networks:
      - go-auth-network

  minio:
    image: minio/minio
    container_name: go-auth-minio
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./minio:/data
    command: server /data --console-address ":9001"
    networks:
      - go-auth-network

  redis:
    image: redis:8
    container_name: go-auth-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./redis:/data
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    networks:
      - go-auth-network

volumes:
  go-auth-db:
    name: go-auth-db
networks:
  go-auth-network:
    driver: bridge
