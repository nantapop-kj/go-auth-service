services:
  go-auth-db:
    image: postgres:16-alpine
    container_name: go-auth-db
    volumes:
      - go-auth-db:/var/lib/postgresql/data
    ports:
      - "${PG_PORT}:5432"
    environment:
      POSTGRES_DB: ${PG_DATABASE}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - go-auth-network

  go-auth-service:
    image: go-auth-service:dev
    container_name: go-auth-service
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    env_file: .env
    environment:
      PG_HOST: ${PG_DATABASE}
      PG_PORT: ${PG_PORT}
      REDIS_ADDRESS: redis:6379
    volumes:
      - ./:/app
    depends_on:
      go-auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - go-auth-network

  redis:
    image: redis:8-alpine
    container_name: go-auth-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./redis:/data
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - go-auth-network

volumes:
  go-auth-db:
    name: go-auth-db

networks:
  go-auth-network:
    driver: bridge
